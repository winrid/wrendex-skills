name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  skills-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # skills/ is generated and committed. If a change to templates/ or
      # tools/ did not get rebuilt, the installable skills are stale.
      - run: npm run check
